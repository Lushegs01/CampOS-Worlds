name: Release checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run verify:release
      # The hosted Ubuntu image already supplies Chrome's runtime libraries. Avoid an
      # unrelated apt upgrade blocking the game checks; the browser launch verifies them.
      - name: Install Chromium
        timeout-minutes: 5
        run: npx playwright install chromium
      - run: node tests/browser-account-recovery.mjs
      - run: npm run test:release
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: release-evidence
          path: docs/release/
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: docker build -f server/Dockerfile -t campos-worlds-room:release .
      - run: node tests/container-release.mjs
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: container-evidence
          path: docs/release/container.json
  capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:capacity
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: capacity-evidence
          path: docs/release/capacity.json
