name: Release checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: release-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
# Pinned: ubuntu-latest became Ubuntu 26.04, where the pinned Playwright (1.58.2) cannot install browsers.
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run verify:release
      # The hosted Ubuntu image already supplies Chrome's runtime libraries. Avoid an
      # unrelated apt upgrade blocking the game checks; the browser launch verifies them.
      - name: Install Chromium
        timeout-minutes: 5
        run: npx playwright install chromium
      - run: node tests/browser-account-recovery.mjs
      - run: npm run test:release
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: release-evidence
          path: docs/release/
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Exercise private checkout permissions
        run: |
          chmod -R go-rwx server shared
          chmod go-rwx package.json package-lock.json
      - run: docker build -f server/Dockerfile -t campos-worlds-room:release .
      - run: node tests/container-release.mjs
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: container-evidence
          path: docs/release/container.json
  capacity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:capacity
        env:
          CAPACITY_SECONDS: 300
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: capacity-evidence
          path: docs/release/capacity.json
  account-engines:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        engine: [firefox, webkit]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install browser engine
        timeout-minutes: 5
        run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: node tests/browser-account-recovery.mjs
        env:
          BROWSER_ENGINE: ${{ matrix.engine }}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: account-${{ matrix.engine }}-evidence
          path: docs/release/account-recovery-${{ matrix.engine }}.json
  arena-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium
        timeout-minutes: 5
        run: npx playwright install chromium
      - name: Combat Arena in two browsers and on a phone
        timeout-minutes: 14
        run: node tests/browser-arena.mjs
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: arena-evidence
          path: |
            docs/arena-results.json
            docs/screenshots/arena/
  account-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium
        timeout-minutes: 5
        run: npx playwright install chromium
      - name: Two-campus account interface
        # Two software-rendered scenes vary substantially by hosted runner. Preserve
        # the per-action deadlines/assertions and budget the entire sequence + cleanup.
        timeout-minutes: 16
        run: node tests/browser-accounts.mjs
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: account-ui-evidence
          path: |
            docs/accounts-results.json
            docs/screenshots/accounts/
